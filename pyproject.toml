[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-ai-animation-studio"
version = "0.1.0"
description = "Automated children's Bible YouTube video factory — LOCAL-FIRST + CLOUD-ON-DEMAND"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Hermes Agent"}]

dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "diffusers>=0.31.0",
    "transformers>=5.0.0",
    "accelerate>=1.0.0",
    "peft>=0.20.0",
    "safetensors>=0.4.0",
    "edge-tts>=7.0.0",
    "faster-whisper>=1.0.0",
    "runpod>=1.10.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
studio = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
