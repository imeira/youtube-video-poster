name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: History, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML pytest pytest-asyncio pytest-cov ruff

      - name: Detect project structure
        id: project
        shell: bash
        run: |
          if [[ -f pyproject.toml ]]; then
            echo "python_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_project=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d tests/unit ]]; then
            echo "unit_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "unit_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install project dependencies
        if: steps.project.outputs.python_project == 'true'
        run: python -m pip install -e ".[dev]"

      - name: Validate workflow YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          if not workflows:
              raise SystemExit("No GitHub Actions workflows found")
          for workflow in workflows:
              with workflow.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"VALID: {workflow}")
          PY

      - name: Record implementation history
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_ENV"

          {
            echo "## Implementation history"
            echo
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- Ref: \`${REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Base: \`${base_sha}\`"
            echo
            echo "### Recent commits"
            echo '```text'
            git log --oneline --decorate -20
            echo '```'
            echo
            echo "### Files changed in this implementation"
            echo '```text'
            git diff --name-status "$base_sha" "$GITHUB_SHA" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff changed Python files
        if: steps.project.outputs.python_project == 'true'
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" -- "*.py"
          )
          if (( ${#python_files[@]} == 0 )); then
            echo "No changed Python files to lint."
            exit 0
          fi
          printf 'Linting %s changed Python files.\n' "${#python_files[@]}"
          ruff check --output-format=github "${python_files[@]}"

      - name: Compile Python sources
        if: steps.project.outputs.python_project == 'true'
        shell: bash
        run: |
          paths=()
          [[ -d src ]] && paths+=(src)
          [[ -d tests ]] && paths+=(tests)
          if (( ${#paths[@]} > 0 )); then
            python -m compileall -q "${paths[@]}"
          else
            echo "No src/ or tests/ directories to compile."
          fi

      - name: Run unit tests
        if: steps.project.outputs.unit_tests == 'true'
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest tests/unit/ -m "not slow" --tb=short -q \
            --junitxml=reports/pytest.xml

      - name: Note absent Python tests
        if: steps.project.outputs.unit_tests != 'true'
        run: echo "No tests/unit directory on this branch; Python test gate skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test history
        if: always() && steps.project.outputs.unit_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize result
        if: always()
        run: |
          {
            echo
            echo "## Quality gates"
            echo
            echo "- Workflow YAML: validated"
            echo "- Python project detected: \`${{ steps.project.outputs.python_project }}\`"
            echo "- Unit tests detected: \`${{ steps.project.outputs.unit_tests }}\`"
            echo "- Ruff is advisory until the historical baseline is clean."
          } >> "$GITHUB_STEP_SUMMARY"
